<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAX AI Assistant</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#080e1c;
 color:white;
 font-family:Arial,sans-serif;
 text-align:center;
 padding:35px 15px;
}
h1{color:#00e5ff;font-size:35px}
.circle{
 width:160px;height:160px;
 border:4px solid #00e5ff;
 border-radius:50%;
 margin:45px auto;
 display:flex;
 align-items:center;
 justify-content:center;
 box-shadow:0 0 30px #00bfff;
 font-size:24px;
 color:#00e5ff;
}
button{
 background:#00c9e8;
 color:#00101a;
 border:0;
 padding:15px 25px;
 border-radius:30px;
 font-size:17px;
 margin:8px;
 font-weight:bold;
}
#langBtn{background:#ffb300}
#output{
 margin:30px auto;
 padding:18px;
 border:1px solid #00c9e8;
 border-radius:12px;
 max-width:400px;
 min-height:65px;
}
</style>
</head>
<body>

<h1>MAX AI</h1>
<p>Your Personal Voice Assistant</p>

<div class="circle">MAX</div>

<button onclick="startListening()">TALK TO MAX</button>
<button onclick="greet()">START</button>
<br>
<button id="langBtn" onclick="toggleLang()">Language: हिंदी</button>

<div id="output">नमस्ते! मैं MAX हूँ। मुझसे कुछ भी पूछो।</div>

<script>
let LANG="hi-IN"; // "hi-IN" = Hindi, "en-IN" = English

function speak(text){
 document.getElementById("output").innerText=text;
 speechSynthesis.cancel();
 let speech=new SpeechSynthesisUtterance(text);
 speech.lang=LANG;
 speechSynthesis.speak(speech);
}

function t(hi,en){ return LANG==="hi-IN" ? hi : en; }

function greet(){
 speak(t("नमस्ते! मैं मैक्स हूँ। मैं आपकी कैसे मदद कर सकता हूँ?","Hello! I am Max. How can I help you?"));
}

function toggleLang(){
 LANG = (LANG==="hi-IN") ? "en-IN" : "hi-IN";
 document.getElementById("langBtn").innerText = LANG==="hi-IN" ? "Language: हिंदी" : "Language: English";
 speak(t("अब मैं हिंदी में बात करूँगा।","Now I will talk in English."));
}

// Filler words hata do, jo bache wahi search query
const FILLER=[
 "open","ओपन","खोलो","खोल","kholo",
 "youtube","यूट्यूब","यू","ट्यूब",
 "google","गूगल",
 "search","सर्च","खोजो","खोज","ढूंढो","ढूँढो","dhundo",
 "karo","करो","कर","kar","do","दो",
 "on","पर","par","and","और","aur","for","me","में","mein"
];

function getSearchQuery(command){
 const hasSearch=/search|सर्च|खोज|ढूंढ|ढूँढ/.test(command);
 if(!hasSearch) return "";
 let words=command.split(/\s+/).filter(function(w){
  return w && !FILLER.includes(w);
 });
 return words.join(" ").trim();
}

function has(command,list){
 return list.some(function(w){return command.includes(w);});
}

function startListening(){
 const Recognition=window.SpeechRecognition ||
 window.webkitSpeechRecognition;

 if(!Recognition){
 speak(t("इस ब्राउज़र में वॉइस सपोर्ट नहीं है।","Voice recognition is not supported in this browser."));
 return;
 }

 const recognition=new Recognition();
 recognition.lang=LANG;
 recognition.start();
 document.getElementById("output").innerText=t("सुन रहा हूँ...","Listening...");

 recognition.onresult=function(event){
 let command=event.results[0][0].transcript.toLowerCase();
 let query=getSearchQuery(command);

 if(has(command,["hello","नमस्ते","हेलो","हैलो","namaste"])){
 speak(t("नमस्ते! वापस आपका स्वागत है।","Hello! Welcome back."));
 }
 else if(has(command,["time","समय","टाइम","बजे"])){
 speak(t("अभी समय है ","The time is ")+new Date().toLocaleTimeString(LANG));
 }
 else if(has(command,["date","तारीख","तारिख","दिनांक","डेट"])){
 speak(t("आज ","Today is ")+new Date().toLocaleDateString(LANG,{weekday:"long",year:"numeric",month:"long",day:"numeric"}));
 }
 else if(has(command,["youtube","यूट्यूब","यू ट्यूब"])){
 if(query){
 speak(t("यूट्यूब पर "+query+" सर्च कर रहा हूँ","Searching "+query+" on YouTube"));
 window.open("https://www.youtube.com/results?search_query="+encodeURIComponent(query),"_blank");
 } else {
 speak(t("यूट्यूब खोल रहा हूँ","Opening YouTube"));
 window.open("https://www.youtube.com","_blank");
 }
 }
 else if(has(command,["google","गूगल"])){
 if(query){
 speak(t("गूगल पर "+query+" सर्च कर रहा हूँ","Searching "+query+" on Google"));
 window.open("https://www.google.com/search?q="+encodeURIComponent(query),"_blank");
 } else {
 speak(t("गूगल खोल रहा हूँ","Opening Google"));
 window.open("https://www.google.com","_blank");
 }
 }
 else if(query){
 speak(t("गूगल पर "+query+" सर्च कर रहा हूँ","Searching "+query+" on Google"));
 window.open("https://www.google.com/search?q="+encodeURIComponent(query),"_blank");
 }
 else{
 speak(t("आपने कहा: "+command+"। मैं मदद के लिए तैयार हूँ।","You said "+command+". I am ready to help."));
 }
 };

 recognition.onerror=function(){
 speak(t("कृपया दोबारा बोलिए।","Please try speaking again."));
 };
}
</script>

</body>
</html>
